name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_DEV: ${{ secrets.ECR_REPOSITORY_DEV }}
  ECR_REPOSITORY_PROD: ${{ secrets.ECR_REPOSITORY_PROD }}
  EC2_INSTANCE_ID_DEV: ${{ secrets.EC2_INSTANCE_ID_DEV }}
  EC2_INSTANCE_ID_PROD: ${{ secrets.EC2_INSTANCE_ID_PROD }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run tests and quality checks
        run: |
          docker build --target test -t thumbnailgenerator-test ./backend
          docker build --target quality -t thumbnailgenerator-quality ./backend

  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          docker build \
            --build-arg SPRING_PROFILES_ACTIVE=dev \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_DEV:$TIMESTAMP \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_DEV:$TIMESTAMP

      - name: Deploy to EC2
        id: deploy
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)  
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID_DEV }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo \"=== Starting deployment ====\"",
              
              "echo \"=== ECR Login ====\"",
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
              
              "echo \"=== Pulling Image ====\"",
              "docker pull '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_DEV }}:'\"'${TIMESTAMP}'\"",
              
              "echo \"=== Stopping old container ====\"",
              "docker stop thumbnailgenerator-backend || true",
              "docker rm thumbnailgenerator-backend || true",
              
              "echo \"=== Starting new container ====\"",
              "docker run -d --name thumbnailgenerator-backend \
                -p 8080:8080 \
                -e SPRING_PROFILES_ACTIVE=dev \
                --restart unless-stopped \
                '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_DEV }}:'\"'${TIMESTAMP}'\"",
              
              "echo \"=== Container Status ====\"",
              "docker ps",
              "docker logs thumbnailgenerator-backend || true"
            ]' \
            --output text --query "Command.CommandId")
          echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT
      - name: Wait and Get Command Output
        run: |
            sleep 10  
            aws ssm get-command-invocation \
                --command-id ${{ steps.deploy.outputs.command_id }} \
                --instance-id "${{ env.EC2_INSTANCE_ID_DEV }}" \
                --query "StandardOutputContent" \
                --output text
  deploy-prod:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          docker build \
            --build-arg SPRING_PROFILES_ACTIVE=prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_PROD:$TIMESTAMP \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_PROD:$TIMESTAMP
      - name: Deploy to EC2
        run: |
            aws ssm send-command \
                --instance-ids "${{ env.EC2_INSTANCE_ID_PROD }}" \
                --document-name "AWS-RunShellScript" \
                --parameters 'commands=[
                "cd ~/thumbnailgenerator",
                "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
                "docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY_PROD}:${TIMESTAMP}",
                "docker-compose -f docker-compose.backend.yml down",
                "docker-compose -f docker-compose.backend.yml up -d"
                ]' \
                --output text
  