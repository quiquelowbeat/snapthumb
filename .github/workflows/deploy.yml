name: CI/CD Pipeline

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

env:
  # AWS Configuration
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  
  # ECR Repositories
  ECR_REPOSITORY_DEV: ${{ secrets.ECR_REPOSITORY_DEV }}
  ECR_REPOSITORY_PROD: ${{ secrets.ECR_REPOSITORY_PROD }}
  
  # EC2 Instances
  EC2_INSTANCE_ID_DEV: ${{ secrets.EC2_INSTANCE_ID_DEV }}
  EC2_INSTANCE_ID_PROD: ${{ secrets.EC2_INSTANCE_ID_PROD }}
  
  # Spring Security
  SPRING_SECURITY_USERNAME: ${{ secrets.SPRING_SECURITY_USERNAME }}
  SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}
  
  # Database Configuration
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  
  # PgAdmin Configuration
  PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
  PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
  
  # External Services
  FAL_KEY: ${{ secrets.FAL_KEY }}
  GRAYLOG_HOST: ${{ secrets.GRAYLOG_HOST }}
  
  # Docker Configuration
  DOCKER_CONTAINER_NAME: thumbnailgenerator-backend
  DOCKER_PORT: 8080

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests and quality checks
        run: |
          docker build --target test -t thumbnailgenerator-test ./backend
          docker build --target quality -t thumbnailgenerator-quality ./backend

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - environment: dev
            branch: refs/heads/develop
            ecr_repository: ${{ env.ECR_REPOSITORY_DEV }}
            instance_id: ${{ env.EC2_INSTANCE_ID_DEV }}
          - environment: prod
            branch: refs/heads/main
            ecr_repository: ${{ env.ECR_REPOSITORY_PROD }}
            instance_id: ${{ env.EC2_INSTANCE_ID_PROD }}
    if: github.ref == matrix.branch

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build_push
        timeout-minutes: 10
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=${{ matrix.environment }}-$(date +%Y%m%d-%H%M%S)
          docker build \
            --build-arg SPRING_PROFILES_ACTIVE=${{ matrix.environment }} \
            -t $ECR_REGISTRY/${{ matrix.ecr_repository }}:$TAG \
            ./backend
          docker push $ECR_REGISTRY/${{ matrix.ecr_repository }}:$TAG
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        timeout-minutes: 5
        run: |
          aws ssm send-command \
            --instance-ids "${{ matrix.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "docker system prune -f || true",
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ steps.login-ecr.outputs.registry }}'",
              "docker pull '${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repository }}:${{ steps.build_push.outputs.tag }}'",
              "docker stop ${{ env.DOCKER_CONTAINER_NAME }} || true && docker rm ${{ env.DOCKER_CONTAINER_NAME }} || true",
              "docker run -d --name ${{ env.DOCKER_CONTAINER_NAME }} \
                -p ${{ env.DOCKER_PORT }}:${{ env.DOCKER_PORT }} \
                -e SPRING_PROFILES_ACTIVE=${{ matrix.environment }} \
                -e DB_USERNAME=${{ env.DB_USERNAME }} \
                -e DB_PASSWORD=${{ env.DB_PASSWORD }} \
                -e DB_NAME=${{ env.DB_NAME }} \
                -e DB_HOST=${{ env.DB_HOST }} \
                -e DB_PORT=${{ env.DB_PORT }} \
                -e FAL_KEY=${{ env.FAL_KEY }} \
                -e PGADMIN_DEFAULT_EMAIL=${{ env.PGADMIN_DEFAULT_EMAIL }} \
                -e PGADMIN_DEFAULT_PASSWORD=${{ env.PGADMIN_DEFAULT_PASSWORD }} \
                -e SPRING_SECURITY_USERNAME=${{ env.SPRING_SECURITY_USERNAME }} \
                -e SPRING_SECURITY_PASSWORD=${{ env.SPRING_SECURITY_PASSWORD }} \
                -e GRAYLOG_HOST=${{ env.GRAYLOG_HOST }} \
                --restart unless-stopped \
                --health-cmd \"curl -f http://localhost:${{ env.DOCKER_PORT }}/actuator/health || exit 1\" \
                --health-interval=30s \
                --health-timeout=10s \
                --health-retries=3 \
                --health-start-period=60s \
                '${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repository }}:${{ steps.build_push.outputs.tag }}'"
            ]' \
            --output text

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - environment: dev
            branch: refs/heads/develop
            instance_id: ${{ env.EC2_INSTANCE_ID_DEV }}
          - environment: prod
            branch: refs/heads/main
            instance_id: ${{ env.EC2_INSTANCE_ID_PROD }}
    if: github.ref == matrix.branch

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for container health check
        run: |
          aws ssm send-command \
            --instance-ids "${{ matrix.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo \"Waiting for container health check...\"",
              "timeout 300s bash -c '\''until docker inspect ${{ env.DOCKER_CONTAINER_NAME }} --format=\"{{.State.Health.Status}}\" | grep -q \"healthy\"; do echo \"Waiting for container to become healthy...\"; sleep 10; done'\''",
              "echo \"Container is healthy!\""
            ]' \
            --output text
