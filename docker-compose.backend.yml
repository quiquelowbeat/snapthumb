services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - snapthumb-network
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    hostname: mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - snapthumb-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - snapthumb-network
    restart: always

  graylog:
    env_file:
      - .env
    image: graylog/graylog:5.0
    container_name: graylog
    ports:
      - "9000:9000"  
      - "12201:12201/udp"  
    networks:
      - snapthumb-network
    restart: always
    depends_on:
      - mongodb
      - elasticsearch
    volumes:
      - graylog_journal:/usr/share/graylog/data/journal
      
networks:
  snapthumb-network:
    driver: bridge
volumes:
  mongodb_data:
  es_data:
  graylog_journal: