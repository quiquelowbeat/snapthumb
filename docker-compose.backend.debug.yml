services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "5005:5005"
    networks:
      - snapthumb-network
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    networks:
      - snapthumb-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    networks:
      - snapthumb-network
    restart: always

  graylog:
    env_file:
      - .env
    image: graylog/graylog:5.0
    container_name: graylog
    ports:
      - "9000:9000"  
      - "12201:12201/udp"  
    networks:
      - snapthumb-network
    restart: always
    depends_on:
      - mongodb
      - elasticsearch

networks:
  snapthumb-network:
    driver: bridge